name: Idp5
version: "1.0.0"
license: "GPL-2.0-or-later"
date: 2026-11-08
description: |
    Identification of the groups of order dividing p^5

authors:
    - name: Heiko Dietrich
      url: http://users.monash.edu.au/~heikod/
    - name: Henrik Schanze
      url: https://www.iaa.tu-bs.de/henschan

maintainers:
    - name: Heiko Dietrich
      url: http://users.monash.edu.au/~heikod/

GAP: ">= 4.14"

needed-pkgs:
    - name: "smallgrp"
      version: ">= 1.5"
      url: "https://gap-packages.github.io/smallgrp/"

suggested-pkgs:
    - name: "autpgrp"
      version: ">= 1.10"
      url: "https://gap-packages.github.io/autpgrp/"

www: https://heikodietrich.github.io/idp5/
readme: README.md
packageinfo: https://heikodietrich.github.io/idp5/PackageInfo.g

downloads:
    - name: .tar.gz
      url: https://github.com/heikodietrich/idp5/releases/download/v1.0.0/idp5-1.0.0.tar.gz

abstract: |
    The <span class="pkgname">Idp5</span> package identifies the groups of order dividing p<sup>5</sup>, for any prime p, with the groups in the SmallGroups library, and constructs isomorphisms onto the library groups.

doc-html: doc/chap0.html
doc-pdf: doc/manual.pdf
keywords: |
    group identification, IdGroup, IdSmallGroup, p-groups, groups of order p^5, small groups library, isomorphism.
